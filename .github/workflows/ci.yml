# Build + unit test moi module. GitHub Actions tu dat CI=true -> build.gradle bo cac test
# @Tag("integration") (can Postgres/Redis/RabbitMQ). Chay du ca integration o may local:
#   docker compose up -d --wait  roi  ./gradlew build
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # grpc-api can protoc + protoc-gen-grpc-java (binary glibc): runner Ubuntu chay duoc,
      # khong gap loi "program not found" nhu tren Alpine.
      - run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
