# Build + unit test moi module. GitHub Actions tu dat CI=true -> build.gradle bo cac test
# @Tag("integration") (can Postgres/Redis/RabbitMQ). Chay du ca integration o may local:
#   docker compose up -d --wait  roi  cd backend && ./gradlew build
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # grpc-api can protoc + protoc-gen-grpc-java (binary glibc): runner Ubuntu chay duoc,
      # khong gap loi "program not found" nhu tren Alpine.
      - run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: 'backend/**/build/reports/tests/'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      # PageProps/LayoutProps la kieu Next sinh ra (.next/types) -> phai typegen truoc tsc
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
