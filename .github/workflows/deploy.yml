# Deploy len VPS sau khi "Docker Build & Push" thanh cong tren main
# (tham khao: vanh251/OMNICHANNEL-E-COMMERCE-PLATFORM).
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (tuy chon, mac dinh 22).
name: Deploy Production

on:
  workflow_run:
    workflows:
      - Docker Build & Push
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/omnichannel-ecommerce
            DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            echo "=== Disk usage before deploy ==="
            df -h /

            echo "=== Free up disk: remove stopped containers & dangling images ==="
            docker container prune -f
            docker image prune -f

            echo "=== Sync latest repo configurations ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Pull latest images ==="
            $DC pull -q

            echo "=== Restart services ==="
            $DC up -d --remove-orphans

            echo "=== Wait for 9 services to be healthy (max 3 minutes) ==="
            timeout 180 bash -c "until [ \$($DC ps | grep -c '(healthy)') -ge 9 ]; do echo 'Waiting for services...'; sleep 5; done" \
              || echo "Warning: some services may not be healthy yet"

            echo "=== Remove unused images after deploy ==="
            docker image prune -f

            echo "=== Disk usage after deploy ==="
            df -h /

            echo "=== Deployment completed ==="
            $DC ps
