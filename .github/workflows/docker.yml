# Build + push 7 image (6 service + frontend) len GHCR khi push main.
# Deploy kieu pull: cron tren VPS chay scripts/deploy/auto-deploy.sh moi 2 phut, keo image moi ve
# (nha cung cap VPS chan SSH tu GitHub Actions; ly do o docs/Scope_Adjustments.md muc 6).
name: Docker Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build --no-daemon

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=${{ env.REGISTRY }}/${OWNER_LOWER}/omnichannel" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest

      # Build context la backend/ (multi-module Gradle can common + grpc-api),
      # Dockerfile nam trong tung service.
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=${{ env.REGISTRY }}/${OWNER_LOWER}/omnichannel" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha
            type=raw,value=latest

      # GATEWAY_URL duoc ghi vao ban build (rewrites cua Next) -> ten service trong mang Docker
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: GATEWAY_URL=http://api-gateway:8080
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
