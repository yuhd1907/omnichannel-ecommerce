# Push main -> unit test -> build + push 7 image (6 service + frontend) len GHCR, tag sha-<commit> va latest
# -> job "Deploy to VPS": appleboy/ssh-action SSH vao VPS, dua repo ve dung commit nay roi chay
#    scripts/deploy/deploy.sh sha-<commit>: pull image, up --wait (health check), loi thi quay lai tag cu.
# Production chay tag bat bien sha-<commit>, khong dung latest. Job deploy gan GitHub Environment
# "production": bat "Required reviewers" (Settings -> Environments) neu muon duyet tay truoc khi deploy.
name: Docker Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build --no-daemon

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=${{ env.REGISTRY }}/${OWNER_LOWER}/omnichannel" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest

      # Build context la backend/ (multi-module Gradle can common + grpc-api),
      # Dockerfile nam trong tung service.
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=${{ env.REGISTRY }}/${OWNER_LOWER}/omnichannel" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha
            type=raw,value=latest

      # GATEWAY_URL duoc ghi vao ban build (rewrites cua Next) -> ten service trong mang Docker
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: GATEWAY_URL=http://api-gateway:8080
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    needs:
      - build
      - frontend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://huyecommerce.duckdns.org

    steps:
      # Tag bat bien do docker/metadata-action (type=sha) tao: sha-<7 ky tu dau cua commit>
      - name: Compute image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Deploy through SSH
        # Pin theo commit SHA thay vi tag v1 (tag co the bi doi tro sang commit khac)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 15m
          envs: IMAGE_TAG,DEPLOY_SHA
          script: |
            set -eu
            cd /home/huy/omnichannel-ecommerce

            # Code (compose, script) cung commit voi image se deploy
            git fetch --prune origin main
            git checkout -q main
            git merge --ff-only "$DEPLOY_SHA"

            # pull -> up --wait -> health check; loi thi tu quay lai tag truoc va thoat ma 1
            bash scripts/deploy/deploy.sh "$IMAGE_TAG"
