plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'api-gateway'

ext {
    set('springCloudVersion', "2025.1.3")
}

// Gateway xac thuc JWT bang JwtAuthGlobalFilter, KHONG dung Spring Security.
// common khai bao starter-security o scope 'api' -> neu de lot vao day, Boot
// tu cau hinh SecurityWebFilterChain mac dinh (HTTP Basic + CSRF) chay TRUOC
// GlobalFilter -> moi request (ke ca GET /products public) bi 401 "Basic realm".
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-security'
}

dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
