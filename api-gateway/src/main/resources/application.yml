spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-login
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_LOGIN_REPLENISH:3}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_LOGIN_BURST:5}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: identity-service
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: product-service
              uri: ${PRODUCT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**, /api/v1/admin/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: payment-service
              uri: ${PAYMENT_URI:http://localhost:8084}
              order: -1
              predicates:
                - Path=/api/v1/orders/*/payments, /api/v1/webhooks/**, /api/v1/admin/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: order-service
              uri: ${ORDER_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/orders/**, /api/v1/admin/inventory/**, /api/v1/admin/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            # OpenAPI spec cua tung service cho Swagger UI tai /swagger-ui.html.
            # Khong rate limit, khong can JWT (whitelist trong JwtAuthGlobalFilter).
            - id: openapi-identity
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api-docs/identity
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-product
              uri: ${PRODUCT_URI:http://localhost:8082}
              predicates:
                - Path=/api-docs/product
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-order
              uri: ${ORDER_URI:http://localhost:8083}
              predicates:
                - Path=/api-docs/order
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-payment
              uri: ${PAYMENT_URI:http://localhost:8084}
              predicates:
                - Path=/api-docs/payment
              filters:
                - SetPath=/v3/api-docs

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram de Grafana tinh p95/p99 bang histogram_quantile
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Swagger UI gom spec cua 4 service: http(s)://<host>/swagger-ui.html
# Tat tren prod neu can: SPRINGDOC_SWAGGER_UI_ENABLED=false
springdoc:
  api-docs:
    # Can bat de Swagger UI doc /v3/api-docs/swagger-config; danh sach spec lay tu 'urls' ben duoi
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: identity-service
        url: /api-docs/identity
      - name: product-service
        url: /api-docs/product
      - name: order-service
        url: /api-docs/order
      - name: payment-service
        url: /api-docs/payment
