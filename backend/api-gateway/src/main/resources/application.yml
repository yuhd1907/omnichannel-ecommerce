spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-login
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_LOGIN_REPLENISH:3}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_LOGIN_BURST:5}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: identity-service
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            # Anh san pham: cong khai, KHONG rate limit (trang chu tai nhieu anh cung luc se bi 429).
            # Dat truoc route product-service de khop truoc.
            - id: product-images
              uri: ${PRODUCT_URI:http://localhost:8082}
              predicates:
                - Method=GET
                - Path=/api/v1/products/images/**
            - id: product-service
              uri: ${PRODUCT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**, /api/v1/admin/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: payment-service
              uri: ${PAYMENT_URI:http://localhost:8084}
              order: -1
              predicates:
                - Path=/api/v1/orders/*/payments, /api/v1/payments/**, /api/v1/webhooks/**, /api/v1/admin/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: order-service
              uri: ${ORDER_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/orders/**, /api/v1/admin/inventory/**, /api/v1/admin/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

server:
  port: ${GATEWAY_PORT:8080}

management:
  # Distributed tracing (Micrometer Tracing + OpenTelemetry) -> Jaeger qua OTLP HTTP.
  # Demo lay mau 100%; prod tai cao nen ha TRACING_SAMPLING_PROBABILITY (vd 0.1).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${DEPLOY_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # Starter OpenTelemetry kem theo exporter metrics/log OTLP: tat, metrics da co Prometheus,
  # log da co Promtail -> Loki (Jaeger chi nhan trace).
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  observations:
    enable:
      # Outbox relay / expiry job @Scheduled chay moi giay -> moi lan 1 trace rong, lam ngap Jaeger
      tasks.scheduled: false
      # Span cua tung security filter: nhieu va khong giup doc luong nghiep vu
      spring.security: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram de Grafana tinh p95/p99 bang histogram_quantile
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

