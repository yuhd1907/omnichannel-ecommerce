spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    hikari:
      maximum-pool-size: ${IDENTITY_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${IDENTITY_HIKARI_MIN_IDLE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway quan ly schema -> Ngay 4 doi thanh 'validate' khi da co entity + migration.
      ddl-auto: validate
  flyway:
    # Ngay 4: bat len khi da co file migration dau tien trong db/migration.
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${IDENTITY_PORT:8081}

management:
  # Distributed tracing (Micrometer Tracing + OpenTelemetry) -> Jaeger qua OTLP HTTP.
  # Demo lay mau 100%; prod tai cao nen ha TRACING_SAMPLING_PROBABILITY (vd 0.1).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${DEPLOY_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # Starter OpenTelemetry kem theo exporter metrics/log OTLP: tat, metrics da co Prometheus,
  # log da co Promtail -> Loki (Jaeger chi nhan trace).
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  observations:
    enable:
      # Outbox relay / expiry job @Scheduled chay moi giay -> moi lan 1 trace rong, lam ngap Jaeger
      tasks.scheduled: false
      # Span cua tung security filter: nhieu va khong giup doc luong nghiep vu
      spring.security: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram de Grafana tinh p95/p99 bang histogram_quantile
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes (ms)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days (ms)
