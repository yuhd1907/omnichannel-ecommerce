spring:
  application:
    name: order-service
  autoconfigure:
    # Service chi verify JWT, khong tu xac thuc user -> bo user in-memory mac dinh
    # (khong in "Using generated security password" ra log moi lan khoi dong).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ORDER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    hikari:
      maximum-pool-size: ${ORDER_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${ORDER_HIKARI_MIN_IDLE:10}
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis chi dung cho Redisson lock, khong co Redis repository -> tat de
      # Spring Data Redis khong quet nham cac JPA repository (log "store assignment").
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    # OutboxRelay chi markSent khi broker ACK. Khong co confirm, send() thanh cong
    # chi nghia la byte da roi socket -> broker sap ngay sau do thi mat event.
    publisher-confirm-type: correlated
    # mandatory: message khong vao duoc queue nao -> bi return thay vi bi drop im lang.
    publisher-returns: true
    template:
      observation-enabled: true
      mandatory: true
    listener:
      simple:
        observation-enabled: true
        # Het retry -> reject khong requeue -> DLX -> DLQ. Khong requeue vo han.
        default-requeue-rejected: false
        retry:
          enabled: true
          # Boot 4 dung 'max-retries' (so lan thu LAI), KHONG con 'max-attempts'
          # (key sai bi bo qua im lang). 2 lan thu lai = tong 3 lan xu ly.
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
  cloud:
    openfeign:
      client:
        config:
          # Identity khong phan hoi thi fail fast (503), khong giu request tao don qua lau.
          identity-client:
            connect-timeout: 5000   # ms
            read-timeout: 5000      # ms
  grpc:
    client:
      channel:
        product:
          target: static://${PRODUCT_GRPC_HOST:localhost}:${PRODUCT_GRPC_PORT:9082}

server:
  port: ${ORDER_PORT:8083}

management:
  # Distributed tracing (Micrometer Tracing + OpenTelemetry) -> Jaeger qua OTLP HTTP.
  # Demo lay mau 100%; prod tai cao nen ha TRACING_SAMPLING_PROBABILITY (vd 0.1).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${DEPLOY_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # Starter OpenTelemetry kem theo exporter metrics/log OTLP: tat, metrics da co Prometheus,
  # log da co Promtail -> Loki (Jaeger chi nhan trace).
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  observations:
    enable:
      # Outbox relay / expiry job @Scheduled chay moi giay -> moi lan 1 trace rong, lam ngap Jaeger
      tasks.scheduled: false
      # Span cua tung security filter: nhieu va khong giup doc luong nghiep vu
      spring.security: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram de Grafana tinh p95/p99 bang histogram_quantile
      percentiles-histogram:
        http.server.requests: true
  health:
    rabbit:
      # Outbox de order-service van nhan don khi broker chet. Neu health phu thuoc
      # Rabbit, Docker bao unhealthy dung luc service dang hoat dong nhu thiet ke.
      enabled: false

app:
  inventory:
    reservation-ttl-minutes: ${ORDER_RESERVATION_TTL_MINUTES:15}
    expiry-check-interval-ms: ${ORDER_EXPIRY_CHECK_INTERVAL_MS:60000}

# Redisson lock theo sku_code khi createOrder chong race condition
order:
  inventory-lock:
    enabled: ${ORDER_INVENTORY_LOCK_ENABLED:true}
    wait-time-seconds: ${ORDER_INVENTORY_LOCK_WAIT_TIME_SECONDS:3}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# URL service nội bộ gọi bằng Feign (override bằng env var khi chạy Docker)
app-clients:
  identity-service-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
