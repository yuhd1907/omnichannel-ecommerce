server {
    listen 80;
    server_name huyecommerce.duckdns.org;

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name huyecommerce.duckdns.org;

    # Chứng chỉ Let's Encrypt (cấp qua DNS-01 challenge)
    ssl_certificate     /etc/letsencrypt/live/huyecommerce.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huyecommerce.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    # Actuator: chi /actuator/health duoc ra Internet. /actuator/prometheus, /info...
    # chi Prometheus trong mang Docker duoc doc (lo metrics = lo cau truc he thong).
    location /actuator/ {
        return 404;
    }

    location ^~ /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
