# ==========================================================================
#  LUU Y HOSTNAME: Compose tu doc file .env de thay ${...}, ma .env dang de
#  *_HOST=localhost cho moi truong chay local. Trong mang Docker, 'localhost'
#  la chinh container do -> moi hostname/URL noi bo duoi day phai VIET CUNG
#  bang TEN SERVICE (postgres, redis, rabbitmq, product-service...), khong
#  dung ${POSTGRES_HOST}. Port noi bo cung co dinh (5432/6379/5672); cac bien
#  *_PORT chi doi port map ra may host.
# ==========================================================================

# Cau hinh chung cho 6 Spring Boot service.
x-spring-service: &spring-service
  restart: unless-stopped
  networks:
    - ecommerce-network
  deploy:
    resources:
      limits:
        # 6 JVM khong gioi han se an het RAM may -> ~3GB cho 6 service.
        memory: 512M

# Heap = 70% gioi han container; SerialGC tiet kiem RAM cho container nho.
x-java-env: &java-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456!}
  JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # Trace -> Jaeger (OTLP HTTP). Ha ty le lay mau khi tai cao: TRACING_SAMPLING_PROBABILITY=0.1
  OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  DEPLOY_ENV: ${DEPLOY_ENV:-local}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456!}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP protocol
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

  # ------------------------------------------------------------------------
  #  Application services
  #  Healthcheck: actuator tra 503 khi DOWN -> wget --spider exit != 0.
  #  depends_on dung 'service_healthy' de doi Postgres/Redis/RabbitMQ that su
  #  nhan ket noi; dang list chi doi container start -> Flyway chet ngay.
  # ------------------------------------------------------------------------
  identity-service:
    <<: *spring-service
    build:
      context: ./backend
      dockerfile: identity-service/Dockerfile
    container_name: ecommerce-identity-service
    environment:
      <<: *java-env
      IDENTITY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  product-service:
    <<: *spring-service
    build:
      context: ./backend
      dockerfile: product-service/Dockerfile
    container_name: ecommerce-product-service
    environment:
      <<: *java-env
      PRODUCT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      # Anh san pham admin tai len (volume giu anh qua cac lan deploy)
      PRODUCT_UPLOAD_DIR: /data/uploads
      # Co gia tri -> anh len Cloudinary (CDN) thay vi volume. Dat trong .env, KHONG commit
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-gom/products}
    volumes:
      - product_uploads:/data/uploads
    ports:
      - "${PRODUCT_PORT:-8082}:8082"
      - "${PRODUCT_GRPC_PORT:-9082}:9082"   # gRPC — mo ra ngoai de test bang grpcurl
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  order-service:
    <<: *spring-service
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile
    container_name: ecommerce-order-service
    environment:
      <<: *java-env
      ORDER_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      PRODUCT_GRPC_HOST: product-service
      PRODUCT_GRPC_PORT: 9082
      # Feign client goi identity-service (lay dia chi giao hang)
      IDENTITY_SERVICE_URL: http://identity-service:8081
      # Thi nghiem flash sale: $env:ORDER_INVENTORY_LOCK_ENABLED='false'; docker compose up -d order-service
      ORDER_INVENTORY_LOCK_ENABLED: ${ORDER_INVENTORY_LOCK_ENABLED:-true}
      ORDER_RESERVATION_TTL_MINUTES: ${ORDER_RESERVATION_TTL_MINUTES:-15}
      ORDER_EXPIRY_CHECK_INTERVAL_MS: ${ORDER_EXPIRY_CHECK_INTERVAL_MS:-60000}
    ports:
      - "${ORDER_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  payment-service:
    <<: *spring-service
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: ecommerce-payment-service
    environment:
      <<: *java-env
      PAYMENT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret-key-12345}
      # VNPAY sandbox (de trong = chi dung MOCK). Return URL tro ve trang cua frontend
      # (trang nay goi /api/v1/payments/vnpay/return de kiem chu ky). Tren VPS dat trong .env:
      #   VNPAY_RETURN_URL=https://<domain>/payment/vnpay-return
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3001/payment/vnpay-return}
    ports:
      - "${PAYMENT_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  notification-service:
    <<: *spring-service
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: ecommerce-notification-service
    environment:
      <<: *java-env
      NOTIFICATION_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      # Gui email that toi Mailpit (xem thu tai http://localhost:8025). false = chi ghi log.
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      # SMTP: mac dinh Mailpit (hop thu gia, xem :8025). Gui thu that: dat SMTP_* trong .env
      # (vd Gmail: smtp.gmail.com / 587 / STARTTLS + App Password) - code khong doi.
      MAIL_HOST: ${SMTP_HOST:-mailpit}
      MAIL_PORT: ${SMTP_PORT:-1025}
      MAIL_USERNAME: ${SMTP_USERNAME:-}
      MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      MAIL_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@gom.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-gom.}
      # Link "Xem don hang" trong email (VPS: https://<domain>)
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3001}
    ports:
      - "${NOTIFICATION_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  api-gateway:
    <<: *spring-service
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce-api-gateway
    environment:
      <<: *java-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IDENTITY_URI: http://identity-service:8081
      PRODUCT_URI: http://product-service:8082
      ORDER_URI: http://order-service:8083
      PAYMENT_URI: http://payment-service:8084
      # Rate limit (token bucket / giay / user hoac IP). Mac dinh giu nguyen nhu cu;
      # chi nang khi chay load test, vd: RATE_LIMIT_LOGIN_REPLENISH=100 trong .env
      RATE_LIMIT_REPLENISH: ${RATE_LIMIT_REPLENISH:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      RATE_LIMIT_LOGIN_REPLENISH: ${RATE_LIMIT_LOGIN_REPLENISH:-3}
      RATE_LIMIT_LOGIN_BURST: ${RATE_LIMIT_LOGIN_BURST:-5}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Web storefront + trang quan tri (Next.js). Trinh duyet goi /api/v1/* cung origin,
  # Next proxy sang api-gateway (local); tren VPS Nginx chuyen /api/ thang toi gateway.
  frontend:
    build:
      context: ./frontend
      args:
        GATEWAY_URL: http://api-gateway:8080
    container_name: ecommerce-frontend
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://api-gateway:8080
      # Cong MOCK: server Next ky webhook bang secret nay (phai trung payment-service)
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret-key-12345}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - ecommerce-network

  # ------------------------------------------------------------------------
  #  Cong cu demo: Mailpit (hop thu gia), Prometheus + Grafana (giam sat)
  # ------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI xem thu
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (de chay service bang gradle bootRun)
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - ecommerce-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/omnichannel-overview.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - ecommerce-network

  # Log tap trung: Promtail doc log moi container qua docker.sock -> Loki -> Grafana (Explore > Loki)
  loki:
    image: grafana/loki:3.5.7
    container_name: ecommerce-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - ecommerce-network

  promtail:
    image: grafana/promtail:3.5.0
    container_name: ecommerce-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - ecommerce-network

  # Trace phan tan: 6 service gui span qua OTLP HTTP (:4318) -> Jaeger (luu RAM, UI :16686)
  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    container_name: ecommerce-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4318}:4318"   # cho service chay bang gradle bootRun ngoai Docker
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  product_uploads:
