# Reverse proxy duy nhat ra Internet (UFW chi mo 22, 80, 443).
#   /                -> frontend Next.js (127.0.0.1:3001)
#   /api/v1/         -> API Gateway (127.0.0.1:8080): JWT, rate limit, routing toi 5 service
# Tren VPS file nay nam o /etc/nginx/sites-available/ecommerce.conf (certbot --nginx da sua them
# phan SSL). Doi file trong repo xong thi copy sang VPS:
#   sudo cp infra/nginx/omnichannel.conf /etc/nginx/sites-available/ecommerce.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream gateway  { server 127.0.0.1:8080; keepalive 32; }
upstream frontend { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80;
    server_name huyecommerce.duckdns.org;

    # certbot renew dung HTTP-01 qua cong 80 (webroot cua plugin nginx) -> chi chuyen huong phan con lai
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 'listen ... http2' thay vi 'http2 on;' vi nginx 1.18 cua Ubuntu 22.04 chua co directive moi
    listen 443 ssl http2;
    server_name huyecommerce.duckdns.org;

    # Let's Encrypt, cap bang 'certbot --nginx' (HTTP-01), tu gia han qua certbot.timer
    ssl_certificate     /etc/letsencrypt/live/huyecommerce.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huyecommerce.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Rate limiter cua gateway lay phan tu CUOI cua X-Forwarded-For (do Nginx ghi) -> client khong gia IP duoc
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Actuator: chi /actuator/health duoc ra Internet. /actuator/prometheus, /info...
    # chi Prometheus trong mang Docker duoc doc (lo metrics = lo cau truc he thong).
    location /actuator/ {
        return 404;
    }
    location ^~ /actuator/health { proxy_pass http://gateway; }

    # API -> gateway (tai lieu API: file OpenAPI trong docs/api, khong public Swagger UI)
    location ^~ /api/v1/ { proxy_pass http://gateway; }

    # Con lai (trang web, /_next/static, /api/mock-gateway cua Next) -> frontend
    location / {
        proxy_pass http://frontend;
    }
}
