spring:
  application:
    name: notification-service
  autoconfigure:
    # Chua co SecurityFilterChain rieng -> chain mac dinh (httpBasic + formLogin)
    # dang bat; bo user in-memory de khong in mat khau ra log va khong ai dang nhap
    # duoc bang user do. Ket qua: moi endpoint tru /actuator/health deu 401.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    listener:
      simple:
        # Het retry -> reject khong requeue -> DLX -> DLQ. Khong requeue vo han.
        default-requeue-rejected: false
        retry:
          enabled: true
          # Boot 4 dung 'max-retries' (so lan thu LAI), KHONG con 'max-attempts'
          # (key sai bi bo qua im lang). 2 lan thu lai = tong 3 lan xu ly.
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

server:
  port: ${NOTIFICATION_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
