spring:
  application:
    name: notification-service
  autoconfigure:
    # Khong co user nao dang nhap vao service nay (xem NotificationSecurityConfig);
    # bo user in-memory de khong in mat khau sinh ngau nhien ra log.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    listener:
      simple:
        # Het retry -> reject khong requeue -> DLX -> DLQ. Khong requeue vo han.
        default-requeue-rejected: false
        retry:
          enabled: true
          # Boot 4 dung 'max-retries' (so lan thu LAI), KHONG con 'max-attempts'
          # (key sai bi bo qua im lang). 2 lan thu lai = tong 3 lan xu ly.
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

  # SMTP: Mailpit khi chay Docker (xem docker-compose.yml). Timeout ngan de SMTP chet
  # khong giu thread listener cua RabbitMQ lau.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

app:
  mail:
    # false: chi ghi log [EMAIL GIA LAP] nhu truoc, khong ket noi SMTP
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@omnichannel.local}

server:
  port: ${NOTIFICATION_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram de Grafana tinh p95/p99 bang histogram_quantile
      percentiles-histogram:
        http.server.requests: true
  health:
    mail:
      # Gui mail la best-effort; Mailpit chet khong duoc lam service bi danh dau unhealthy
      enabled: false
