spring:
  application:
    name: product-service
  autoconfigure:
    # Service chi verify JWT, khong tu xac thuc user -> bo user in-memory mac dinh
    # (khong in "Using generated security password" ra log moi lan khoi dong).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${PRODUCT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    # Giong order-service: OutboxRelay chi markSent khi broker ACK va message vao duoc queue.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  grpc:
    server:
      port: ${PRODUCT_GRPC_PORT:9082}

server:
  port: ${PRODUCT_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram de Grafana tinh p95/p99 bang histogram_quantile
      percentiles-histogram:
        http.server.requests: true
  health:
    rabbit:
      # Giong order/payment: broker chet thi van xem/tim san pham duoc, event nam trong outbox
      # cho relay gui lai. Health phu thuoc RabbitMQ se lam Docker danh dau service UNHEALTHY.
      enabled: false

jwt:
  # Phai giong voi gia tri trong identity-service — doc tu cung bien moi truong JWT_SECRET
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
